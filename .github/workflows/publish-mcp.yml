# Release @depixapp/mcp: publish the npm package AND the MCP Registry entry, both
# via GitHub Actions OIDC — no stored npm token, no passkey/2FA prompt.
#
#   - npm publish uses npm Trusted Publishing (OIDC). The package must be
#     registered as a trusted publisher for THIS repo + workflow on npmjs.com
#     (Package settings -> Trusted publishers). One-time human setup; after that
#     every tagged release publishes with build provenance and no secret.
#   - The MCP Registry publish (registry.modelcontextprotocol.io) also uses OIDC;
#     the repo lives in the `depixapp` GitHub org, so OIDC vouches for the
#     `io.github.depixapp/*` namespace automatically.
#
# ORDERING (enforced by `needs`): npm FIRST, then the registry. The registry
# verifies ownership by fetching @depixapp/mcp@<version> from npm and checking
# its package.json `mcpName` equals this server's name — so the package must
# exist before the registry entry is published.
#
# RELEASE FLOW: bump the version in package.json AND registry/server.json
# (packages[].version), commit, then push tag `v<version>` (e.g. v1.2.0). The
# npm job re-runs safely if the tag is re-pushed: it SKIPS publish when that
# version is already on npm, so the registry step still runs (idempotent re-runs
# + the workflow_dispatch "registry only, once npm is live" path both work).

name: Release (npm + MCP Registry)

on:
  push:
    tags: ["v*"] # version tags like v1.2.0
  workflow_dispatch: {} # manual re-run (skips npm publish if already published)

jobs:
  npm:
    name: Publish @depixapp/mcp to npm (OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC -> npm Trusted Publishing (mints a short-lived token)
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # ── VENDORED ENGINE (unified-MCP spec §2.1/§4) ──────────────────────────
      # The 27 wallet_* tools come from engine SOURCE vendored under src/vendor/**,
      # which IS committed: `npm ci` runs `prepare` -> build, so the sources must
      # already exist — a publish cannot depend on fetching a second (soon private)
      # repo mid-install. What this step adds is the PROOF that the committed tree
      # is exactly the pinned commit: it checks the engine out at
      # vendor/engine.pin.json `ref` and re-runs the vendoring in --check mode,
      # which fails on any byte of drift. Without it a tag could publish a
      # hand-edited engine, and an npm version is immutable forever.
      - name: Read the engine pin
        id: pin
        run: |
          echo "ref=$(node -p "require('./vendor/engine.pin.json').ref")" >> "$GITHUB_OUTPUT"
          echo "repo=$(node -p "new URL(require('./vendor/engine.pin.json').repository).pathname.slice(1)")" >> "$GITHUB_OUTPUT"

      # TODO(P5): depix-sdk goes private at the end of the program — swap this for
      # a deploy key / PAT (`token:` input) when it does. Public today, no secret.
      - name: Checkout the engine at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .vendor-src
          fetch-depth: 0

      - name: Verify the vendored engine matches the pin (fails on any drift)
        run: node scripts/vendor-engine.mjs --from .vendor-src --check

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@11

      - name: Install dependencies
        env:
          # `npm ci` runs `prepare` -> build -> postbuild, which is where the bake
          # happens; the publish step sets it too so both builds agree.
          SIDESHIFT_AFFILIATE_ID: ${{ secrets.SIDESHIFT_AFFILIATE_ID }}
        run: npm ci # runs `prepare` -> build, so a compile error fails fast here

      - name: Verify version consistency (tag == package.json == registry npm entry)
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          NESTED=$(node -p "require('./registry/server.json').packages[0].version")
          if [ "$NESTED" != "$PKG" ]; then
            echo "::error::registry/server.json npm version ($NESTED) != package.json ($PKG)"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::git tag v$TAG != package.json version $PKG"; exit 1
            fi
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # These DO run here, despite ci.yml covering every push and PR: ci.yml is
      # triggered by `push: branches: [main]` and `pull_request`, NEITHER of which
      # fires on a tag, and this job has no `needs:` on a green CI run. So without
      # them a `git tag v2.0.1 && git push --tags` on any commit — including one
      # that never touched main — publishes to npm and to the immutable MCP
      # Registry with nothing but tsc and eslint having looked at it.
      - name: Test
        run: npm test

      - name: Guard — hosted deployment is structurally keyless
        run: npm run guard:hosted

      - name: Guard — THIRD_PARTY_LICENSES is current
        run: npm run licenses:check

      - name: Publish to npm (skip if this version is already published)
        env:
          # Baked into the compiled engine by scripts/postbuild.mjs, which npm
          # publish re-runs through `prepare`. The bake is CONDITIONAL: if this
          # secret does not exist the value is empty, the step is skipped, and the
          # compiled module keeps its runtime `process.env` read — so wiring it
          # here is safe whether or not the secret is ever created. Without the
          # wiring, creating the secret later would have no effect at all.
          SIDESHIFT_AFFILIATE_ID: ${{ secrets.SIDESHIFT_AFFILIATE_ID }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if npm view "@depixapp/mcp@$V" version >/dev/null 2>&1; then
            echo "@depixapp/mcp@$V is already on npm — skipping publish (registry step still runs)."
          else
            npm publish --provenance --access public
          fi

  registry:
    name: Publish server.json to the MCP Registry (OIDC)
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        working-directory: registry
        run: mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry (idempotent — the registry is immutable per version)
        working-directory: registry
        run: |
          # The MCP Registry rejects a re-publish of an existing version (409).
          # Swallow ONLY that "already published" class so a tag re-push or a
          # workflow_dispatch on an already-published version stays green; fail
          # loudly on any other error.
          set +e
          mcp-publisher publish > publish.log 2>&1
          code=$?
          set -e
          cat publish.log
          if [ "$code" -ne 0 ]; then
            if grep -qiE "already exists|already published|409|conflict|duplicate|same version" publish.log; then
              echo "This version is already in the MCP Registry — idempotent no-op, not failing."
            else
              echo "::error::mcp-publisher publish failed"; exit 1
            fi
          fi
