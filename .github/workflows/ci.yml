# Correctness gate: typecheck + lint + test + build on every push to main and
# every PR. This is where code is validated; the release (publish-mcp.yml, on a
# v* tag) trusts a tagged commit already passed here and just publishes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 was DROPPED in 2.0.0: the bundled wallet engine requires >= 22.4
        # (package.json `engines`). BREAKING for gateway-only users still on 20 —
        # called out in CHANGELOG.md and the release notes.
        node: ["22", "24"] # the engine's floor + current
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The hosted (mcp.depixapp.com) function must have ZERO import path to the
      # vendored wallet engine. This is the guarantee that keeps the hosted
      # deployment structurally non-custodial (spec §2.1) — not a promise, a graph.
      - name: Guard — hosted deployment is structurally keyless
        run: npm run guard:hosted

      # THIRD_PARTY_LICENSES must match the production dependency tree that ships
      # in the tarball (spec §2.2). Regenerate + diff, so a dependency bump can
      # never silently drop a required attribution notice.
      - name: Guard — THIRD_PARTY_LICENSES is current
        run: npm run licenses:check

  vendor:
    name: vendored engine matches the pinned commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read the engine pin
        id: pin
        run: |
          echo "ref=$(node -p "require('./vendor/engine.pin.json').ref")" >> "$GITHUB_OUTPUT"
          echo "repo=$(node -p "new URL(require('./vendor/engine.pin.json').repository).pathname.slice(1)")" >> "$GITHUB_OUTPUT"

      # TODO(P5): depix-sdk goes private at the end of the program — swap this for
      # a deploy key / PAT (`token:` input) when it does. Public today, no secret.
      - name: Checkout the engine at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .vendor-src
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No npm install needed: the vendoring script is plain Node + git. It
      # regenerates the tree from the pinned commit and fails on ANY byte of drift,
      # which is what makes the COMMITTED src/vendor/** provably reproducible.
      - name: Verify src/vendor matches the pin
        run: node scripts/vendor-engine.mjs --from .vendor-src --check
